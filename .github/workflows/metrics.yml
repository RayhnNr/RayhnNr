name: Metrics

on:
  # Jalan otomatis tiap hari jam 00:00 UTC (07:00 WIB)
  schedule:
    - cron: "0 0 * * *"
  # Bisa dijalankan manual dari tab Actions
  workflow_dispatch:

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      # 1. Ringkasan profil (followers, stars, repo, dll)
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: RayhnNr
          template: classic
          filename: metrics-overview.svg
          config_timezone: Asia/Jakarta
          retries: 3
          base: header, repositories

      # 2. Bahasa pemrograman paling sering dipakai
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: RayhnNr
          template: classic
          filename: metrics-languages.svg
          config_timezone: Asia/Jakarta
          retries: 3
          base: ""
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-size, percentage

      # 3. Kalender kontribusi 3D (sudah termasuk info streak)
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: RayhnNr
          template: classic
          filename: metrics-calendar.svg
          config_timezone: Asia/Jakarta
          retries: 3
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

      # 4. Pencapaian (badge)
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: RayhnNr
          template: classic
          filename: metrics-habits.svg
          config_timezone: Asia/Jakarta
          retries: 3
          base: ""
          plugin_achievements: yes
          plugin_achievements_threshold: C
          plugin_achievements_secrets: no
          plugin_achievements_limit: 6
